name: Test credential availability

on:
  push:
    branches: [test-credentials-v0.1]
    paths: [.github/workflows/test-credential-availability.yml]

permissions: {}

jobs:
  standard-api-key:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check ordinary API test credential
        env:
          ARK_STANDARD_API_KEY_PRESENT: ${{ secrets.ARK_STANDARD_API_KEY != '' }}
        shell: bash
        run: |
          if [ "$ARK_STANDARD_API_KEY_PRESENT" = "true" ]; then
            echo 'ARK_STANDARD_API_KEY: configured'
            echo 'ARK_STANDARD_API_KEY: configured' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::ARK_STANDARD_API_KEY is not available to this workflow.'
            exit 1
          fi
