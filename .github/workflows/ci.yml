name: CI

on:
  push:
    branches: [main, fix/alpha10-reliability-ui]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Freedom + Fake Ark + Adapter + Host + UI tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Verify tarball and two independent Host starts
        run: pnpm test:package
